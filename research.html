<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/buttons.css">

<div id="header">
  <div id="header-content"></div>
</div>
<div class="main">
  This is the research screen
</div>

<script src="js/header.js"></script>

<script src="https://d3js.org/d3.v4.min.js"></script>

<style>
.link {
  fill: none;
  stroke-width: 2px;
}
</style>

<script>
const treeData = {
  "name": "Eve",
  "value": 15,
  "type": "black",
  "level": "yellow",
  "children": [
    {
      "name": "Seth",
      "value": 10,
      "type": "grey",
      "level": "red",
      "children": [
        {
          "name": "Enos",
          "value": 7.5,
          "type": "grey",
          "level": "purple"
        },
        {
          "name": "Noam",
          "value": 7.5,
          "type": "grey",
          "level": "purple"
        }
      ]
    },
    {
      "name": "Abel",
      "value": 10,
      "type": "grey",
      "level": "blue"
    },
    {
      "name": "Awan",
      "value": 10,
      "type": "grey",
      "level": "green",
      "children": [
        {
          "name": "Enoch",
          "value": 7.5,
          "type": "grey",
          "level": "orange"
        }
      ]
    },
  ]
};

// set the dimensions and margins of the diagram
const margin = {top: 20, right: 90, bottom: 30, left: 90},
      width  = 660 - margin.left - margin.right,
      height = 500 - margin.top - margin.bottom;

// declares a tree layout and assigns the size
const treemap = d3.tree().size([height, width]);

//  assigns the data to a hierarchy using parent-child relationships
let nodes = d3.hierarchy(treeData, d => d.children);

// maps the node data to the tree layout
nodes = treemap(nodes);

// append the svg object to the body of the page
// appends a 'group' element to 'svg'
// moves the 'group' element to the top left margin
const svg = d3.select("body").append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom),
      g = svg.append("g")
        .attr("transform",
            "translate(" + margin.left + "," + margin.top + ")");

// adds the links between the nodes
const link = g.selectAll(".link")
    .data( nodes.descendants().slice(1))
    .enter().append("path")
    .attr("class", "link")
    .style("stroke", d => d.data.level)
    .attr("d", d => {
       return "M" + d.y + "," + d.x
         + "C" + (d.y + d.parent.y) / 2 + "," + d.x
         + " " + (d.y + d.parent.y) / 2 + "," + d.parent.x
         + " " + d.parent.y + "," + d.parent.x;
       });

const nodeWidth = 20

// adds each node as a group
const node = g.selectAll(".node")
    .data(nodes.descendants())
    .enter().append("g")
    .attr("class", d => "node" + (d.children ? " node--internal" : " node--leaf"))
    .attr("transform", d => `translate(${d.y - nodeWidth/2}, ${d.x - nodeWidth/2})`);

// adds the rect to the node
node.append("rect")
  .attr("width", nodeWidth)
  .attr("height", nodeWidth)
  .style("stroke", d => d.data.type)
  .style("fill", d => d.data.level);
  
// adds the text to the node
node.append("text")
  .attr("dy", ".35em")
  .attr("x", d => d.children ? (d.data.value) * -1 : d.data.value + nodeWidth)
  .attr("y", d => d.children && d.depth !== 0 ? -(d.data.value + 5) : d)
  .style("text-anchor", d => d.children ? "end" : "start")
  .text(d => d.data.name);
    
</script>
