<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/emissions-market.css">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

<div id="header">
  <div id="header-content"></div>
</div>
<div class="main">
  <a href="research.html">
    <button class="button-1" id="research">Research</button>
  </a>
  
  <button class="button-1" id="news-button">News</button>
  <div id="news" tabindex="0">
    News

    <div id="news-close-button" class="close-button"><img id="close-icon" src="/icons/xmark-solid.svg"></img></div>
  </div>

  <button class="button-1" id="trading-button">Emissions Trading</button>
  <div id="trading" tabindex="0">
    <div id="buy-emissions-title">Emissions Market</div>
    <div id="market-table">
      <table class="table table-striped">
        <tr  class="table-head"> 
            <th class="centered">Quantity</th>
            <th class="centered">Price</th>
            <th></th>
        </tr>
        <tbody id="trading-table"></tbody>
      </table>
    </div>
    <div class="sell-wrapper">
      <div id="sell-emissions-title">Sell Your Emissions Capacity</div>
      <div>
        <form class="form" id="trading-form">
          <span>
            <label for="quantity" class="form-label">Quantity:</label>
            <input type="number" class="form-input" min="1" id="trading-quantity" />
          </span>

          <span>
            <label for="price" class="form-label">Price:</label>
            <input type="number" class="form-input" min="1" id="trading-price" />
          </span>

          <button type="submit" class="form-input" id="trading-submit" >Post Offer</button>
          
        </form>
      </div>
    </div>
    <div id="market-close-button" class="close-button"><img id="close-icon" src="/icons/xmark-solid.svg"></img></div>

  </div>

  <svg class="node-graph"></svg>

  <div id="node-info" class="interaction-popup" tabindex="0">
    <div class="popup-wrapper">
      <div id="node-title" class="info-title"></div>
      <div id="node-details" class="info-details"></div>
      <div id="node-values">
        <div id="node-yield"></div>
        <div id="node-emissions"></div>
      </div>
      <div id="node-unlock" class="info-unlock">
        <button id="unlock-button" class="button-2">Unlock</button>
      </div>
      <div id="node-enable">
        <button id="enable-button" class="button-2"></button>
      </div>
    </div>
    <div id="node-close-button" class="close-button"><img id="close-icon" src="/icons/xmark-solid.svg"></img></div>
</div>

<script src="https://d3js.org/d3.v4.min.js"></script>

<!--Insert the nodes into the page-->
<script type="module" src="js/NodeGraph/nodeGraph.js"></script>
